name: verso_admin
description: "Real-time monitoring and administration companion app for Verso."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_messaging: ^16.1.2
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^3.0.3
  gap: ^3.0.0
  go_router: ^17.0.0
  google_fonts: ^8.0.2
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  riverpod_annotation: ^4.0.0
  supabase_flutter: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.0+1
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/avatars/
    - assets/fonts/

  fonts:
    - family: Metropolis
      fonts:
        - asset: assets/fonts/Metropolis-Regular.otf
          weight: 400
        - asset: assets/fonts/Metropolis-RegularItalic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Metropolis-Bold.otf
          weight: 700
        - asset: assets/fonts/Metropolis-ExtraBold.otf
          weight: 800
